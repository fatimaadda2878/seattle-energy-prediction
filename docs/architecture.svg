<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Fond -->
  <rect width="800" height="400" fill="#F8FAFC" rx="12"/>

  <!-- Utilisateur -->
  <rect x="30" y="170" width="110" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="85" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">Utilisateur</text>
  <text x="85" y="215" text-anchor="middle" font-size="11" fill="#475569">POST /predict</text>

  <!-- Fleche utilisateur -> API -->
  <line x1="140" y1="200" x2="195" y2="200" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="167" y="190" text-anchor="middle" font-size="10" fill="#64748B">JSON</text>

  <!-- API FastAPI -->
  <rect x="195" y="130" width="160" height="140" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="275" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">API FastAPI</text>
  <text x="275" y="178" text-anchor="middle" font-size="10" fill="#1E40AF">app/main.py</text>
  <text x="275" y="198" text-anchor="middle" font-size="10" fill="#1E40AF">Pydantic validation</text>
  <text x="275" y="218" text-anchor="middle" font-size="10" fill="#1E40AF">GET /health</text>
  <text x="275" y="238" text-anchor="middle" font-size="10" fill="#1E40AF">POST /predict</text>

  <!-- Fleche API -> Modele -->
  <line x1="355" y1="185" x2="415" y2="185" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="175" text-anchor="middle" font-size="10" fill="#64748B">features</text>

  <!-- Fleche Modele -> API retour -->
  <line x1="415" y1="215" x2="355" y2="215" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="235" text-anchor="middle" font-size="10" fill="#64748B">kBtu</text>

  <!-- Modele ML -->
  <rect x="415" y="130" width="160" height="140" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="495" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">Modèle ML</text>
  <text x="495" y="178" text-anchor="middle" font-size="10" fill="#065F46">model.pkl</text>
  <text x="495" y="198" text-anchor="middle" font-size="10" fill="#065F46">GradientBoosting</text>
  <text x="495" y="218" text-anchor="middle" font-size="10" fill="#065F46">StandardScaler</text>
  <text x="495" y="238" text-anchor="middle" font-size="10" fill="#065F46">OneHotEncoder</text>

  <!-- Fleche API -> PostgreSQL -->
  <line x1="275" y1="270" x2="275" y2="320" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="305" y="300" text-anchor="middle" font-size="10" fill="#64748B">save</text>

  <!-- PostgreSQL -->
  <rect x="160" y="320" width="230" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="275" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C1D95">PostgreSQL</text>
  <text x="275" y="365" text-anchor="middle" font-size="10" fill="#4C1D95">buildings (3353) · predictions</text>

  <!-- GitHub Actions -->
  <rect x="580" y="30" width="180" height="70" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="670" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">GitHub Actions</text>
  <text x="670" y="73" text-anchor="middle" font-size="10" fill="#991B1B">push → tests → deploy</text>

  <!-- Swagger -->
  <rect x="580" y="160" width="160" height="60" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5"/>
  <text x="660" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#713F12">Swagger UI</text>
  <text x="660" y="203" text-anchor="middle" font-size="10" fill="#713F12">localhost:8000/docs</text>

  <!-- Fleche API -> Swagger -->
  <line x1="355" y1="175" x2="580" y2="185" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr2)"/>

  <!-- Fleche GitHub -> API -->
  <line x1="630" y1="100" x2="330" y2="155" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr2)"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>
